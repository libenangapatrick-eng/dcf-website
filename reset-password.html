    <!-- =========================================================

         ========================================================= -->

    <script src="js/supabase.js"></script>

    <style>

        body {
            font-family: 'Inter', sans-serif;
        }

        .spinner {
            width: 18px;
            height: 18px;

            border: 2px solid rgba(255,255,255,.35);

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">


<div class="w-full max-w-md">


    <!-- =========================================================
         CARD
         ========================================================= -->

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">


        <!-- =====================================================
             HEADER
             ===================================================== -->

        <div class="bg-dcf-dark-green px-6 py-7 text-white">

            <div class="flex items-center gap-3">

                <div
                    class="w-12 h-12 bg-white rounded-2xl p-1.5 shadow-lg flex items-center justify-center"
                >

                    <img
                        src="images/dcf-logo.png"
                        alt="DCF Logo"
                        class="w-full h-full object-contain"
                        onerror="this.style.display='none'"
                    >

                </div>


                <div>

                    <h1 class="font-bold text-lg tracking-wider uppercase leading-none">
                        DCF
                    </h1>

                    <span
                        class="text-[11px] text-emerald-300 font-medium tracking-wide"
                    >
                        Development Charity Foundation
                    </span>

                </div>

            </div>

        </div>


        <!-- =====================================================
             BODY
             ===================================================== -->

        <div class="p-6 md:p-8">


            <!-- =================================================
                 ERROR
                 ================================================= -->

            <div
                id="errorBox"
                class="hidden mb-5 p-4 rounded-xl text-xs font-medium border bg-red-50 text-red-700 border-red-200"
            ></div>


            <!-- =================================================
                 SUCCESS
                 ================================================= -->

            <div
                id="successBox"
                class="hidden mb-5 p-4 rounded-xl text-xs font-medium border bg-emerald-50 text-emerald-700 border-emerald-200"
            ></div>


            <!-- =================================================
                 LOADING
                 ================================================= -->

            <div
                id="loadingBox"
                class="py-8 text-center"
            >

                <div
                    class="mx-auto w-10 h-10 border-4 border-slate-200 border-t-dcf-green rounded-full animate-spin"
                ></div>

                <p class="text-xs text-slate-500 mt-4">
                    Inathibitisha link ya kurejesha nenosiri...
                </p>

            </div>


            <!-- =================================================
                 RESET PASSWORD FORM
                 ================================================= -->

            <form
                id="resetPasswordForm"
                class="hidden space-y-4"
            >


                <!-- =============================================
                     TITLE
                     ============================================= -->

                <div class="text-center mb-6">

                    <div
                        class="w-12 h-12 bg-emerald-50 text-dcf-green rounded-full flex items-center justify-center mx-auto mb-3 text-xl"
                    >

                        <i class="fas fa-key"></i>

                    </div>

                    <h2 class="text-xl font-bold text-slate-800">
                        Weka Nenosiri Jipya
                    </h2>

                    <p class="text-xs text-slate-500 mt-1">
                        Tengeneza nenosiri jipya la akaunti yako.
                    </p>

                </div>


                <!-- =============================================
                     NEW PASSWORD
                     ============================================= -->

                <div>

                    <label
                        for="newPassword"
                        class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5"
                    >
                        Nenosiri Jipya
                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="newPassword"
                            minlength="6"
                            required
                            autocomplete="new-password"
                            placeholder="••••••••"
                            class="w-full px-3.5 py-3 pr-11 text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-dcf-green/20 focus:border-dcf-green outline-none transition"
                        >


                        <button
                            type="button"
                            onclick="togglePassword('newPassword','newPasswordIcon')"
                            class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600"
                        >

                            <i
                                id="newPasswordIcon"
                                class="fas fa-eye text-xs"
                            ></i>

                        </button>

                    </div>


                    <p class="text-[10px] text-slate-500 mt-1.5">
                        Tumia angalau herufi 6.
                    </p>

                </div>


                <!-- =============================================
                     CONFIRM PASSWORD
                     ============================================= -->

                <div>

                    <label
                        for="confirmPassword"
                        class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5"
                    >
                        Thibitisha Nenosiri
                    </label>


                    <div class="relative">

                        <input
                            type="password"
                            id="confirmPassword"
                            minlength="6"
                            required
                            autocomplete="new-password"
                            placeholder="••••••••"
                            class="w-full px-3.5 py-3 pr-11 text-xs bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-dcf-green/20 focus:border-dcf-green outline-none transition"
                        >


                        <button
                            type="button"
                            onclick="togglePassword('confirmPassword','confirmPasswordIcon')"
                            class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600"
                        >

                            <i
                                id="confirmPasswordIcon"
                                class="fas fa-eye text-xs"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- =================================================
                     PASSWORD MATCH
                     ================================================= -->

                <div
                    id="passwordMatch"
                    class="hidden text-[11px] font-semibold"
                ></div>


                <!-- =================================================
                     SUBMIT
                     ================================================= -->

                <button
                    type="submit"
                    id="resetBtn"
                    class="w-full bg-dcf-green hover:bg-dcf-dark-green text-white font-bold py-3.5 rounded-xl text-xs uppercase shadow-lg shadow-dcf-green/20 transition-all duration-200 flex items-center justify-center gap-2"
                >

                    <span>
                        Weka Nenosiri Jipya
                    </span>

                    <i class="fas fa-check"></i>

                </button>

            </form>


            <!-- =================================================
                 LOGIN LINK
                 ================================================= -->

            <div
                class="text-center border-t border-slate-100 mt-6 pt-5"
            >

                <a
                    href="index.html"
                    class="text-xs text-dcf-green font-bold hover:underline"
                >

                    <i class="fas fa-arrow-left mr-1"></i>

                    Rudi kwenye Login

                </a>

            </div>

        </div>

    </div>


    <!-- =========================================================
         FOOTER
         ========================================================= -->

    <p class="text-center text-[10px] text-slate-400 mt-5">

        © 2026 Development Charity Foundation (DCF).
        All Rights Reserved.

    </p>


</div>



<!-- =============================================================
     JAVASCRIPT
     ============================================================= -->

<script>

'use strict';


/* ================================================================
   ELEMENTS
   ================================================================ */

const resetForm =
    document.getElementById('resetPasswordForm');

const resetBtn =
    document.getElementById('resetBtn');

const newPassword =
    document.getElementById('newPassword');

const confirmPassword =
    document.getElementById('confirmPassword');

const passwordMatch =
    document.getElementById('passwordMatch');

const errorBox =
    document.getElementById('errorBox');

const successBox =
    document.getElementById('successBox');

const loadingBox =
    document.getElementById('loadingBox');


let recoveryReady = false;

let recoveryListener = null;


/* ================================================================
   SHOW ERROR
   ================================================================ */

function showError(message) {

    errorBox.innerHTML = message;

    errorBox.classList.remove('hidden');

    successBox.classList.add('hidden');

}


/* ================================================================
   SHOW SUCCESS
   ================================================================ */

function showSuccess(message) {

    successBox.innerHTML = message;

    successBox.classList.remove('hidden');

    errorBox.classList.add('hidden');

}


/* ================================================================
   HIDE LOADING
   ================================================================ */

function hideLoading() {

    loadingBox.classList.add('hidden');

}


/* ================================================================
   SHOW RESET FORM
   ================================================================ */

function showResetForm() {

    recoveryReady = true;

    hideLoading();

    errorBox.classList.add('hidden');

    resetForm.classList.remove('hidden');

}


/* ================================================================
   PASSWORD VISIBILITY
   ================================================================ */

function togglePassword(inputId, iconId) {

    const input =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (!input || !icon) {
        return;
    }


    if (input.type === 'password') {

        input.type = 'text';

        icon.classList.remove('fa-eye');

        icon.classList.add('fa-eye-slash');

    }

    else {

        input.type = 'password';

        icon.classList.remove('fa-eye-slash');

        icon.classList.add('fa-eye');

    }

}


/* ================================================================
   PASSWORD MATCH
   ================================================================ */

function checkPasswordMatch() {

    const password =
        newPassword.value;

    const confirm =
        confirmPassword.value;


    if (!confirm) {

        passwordMatch.classList.add('hidden');

        return false;

    }


    passwordMatch.classList.remove('hidden');


    if (password === confirm) {

        passwordMatch.textContent =
            '✓ Nenosiri zinafanana.';

        passwordMatch.className =
            'text-[11px] font-semibold text-emerald-700';

        return true;

    }


    passwordMatch.textContent =
        '✕ Nenosiri hazifanani.';

    passwordMatch.className =
        'text-[11px] font-semibold text-red-600';

    return false;

}


newPassword.addEventListener(
    'input',
    checkPasswordMatch
);

confirmPassword.addEventListener(
    'input',
    checkPasswordMatch
);


/* ================================================================
   READ URL PARAMETERS
   ================================================================ */

function getUrlParameters() {

    const hash =
        new URLSearchParams(
            window.location.hash.replace(/^#/, '')
        );


    const query =
        new URLSearchParams(
            window.location.search.replace(/^\?/, '')
        );


    return {

        error:
            hash.get('error') ||
            query.get('error'),

        errorCode:
            hash.get('error_code') ||
            query.get('error_code'),

        errorDescription:
            hash.get('error_description') ||
            query.get('error_description'),

        type:
            hash.get('type') ||
            query.get('type'),

        accessToken:
            hash.get('access_token') ||
            query.get('access_token'),

        refreshToken:
            hash.get('refresh_token') ||
            query.get('refresh_token')

    };

}


/* ================================================================
   EXPIRED / INVALID LINK
   ================================================================ */

function showExpiredLink(message) {

    hideLoading();

    resetForm.classList.add('hidden');


    showError(

        message ||

        '<strong>Link ya kurejesha nenosiri si sahihi au imekwisha muda wake.</strong>' +

        '<br><br>' +

        'Tafadhali rudi kwenye Login na ubofye ' +

        '<strong>“Umesahau Nenosiri?”</strong> ' +

        'kisha omba link mpya.' +

        '<br><br>' +

        '<span class="text-[10px]">' +

        'Usitumie link ya zamani.' +

        '</span>'

    );

}


/* ================================================================
   INITIALIZE SUPABASE RECOVERY
   ================================================================ */

async function initializeRecovery() {

    try {


        /* ========================================================
           VERIFY SUPABASE CLIENT
           ======================================================== */

        if (
            typeof supabaseClient === 'undefined' ||
            !supabaseClient
        ) {

            throw new Error(
                'Supabase client haijapatikana. Kagua js/supabase.js.'
            );

        }


        console.log(
            'DCF Password Recovery: Supabase client detected.'
        );


        /* ========================================================
           CHECK URL ERROR FIRST
           ======================================================== */

        const url =
            getUrlParameters();


        console.log(
            'DCF Password Recovery URL:',
            {
                type: url.type,
                hasAccessToken: !!url.accessToken,
                hasRefreshToken: !!url.refreshToken,
                error: url.error,
                errorCode: url.errorCode
            }
        );


        if (
            url.error ||
            url.errorCode ||
            url.errorDescription
        ) {

            console.error(
                'Supabase recovery URL error:',
                url
            );


            showExpiredLink(
                '<strong>Link ya kurejesha nenosiri imekwisha muda wake.</strong>' +

                '<br><br>' +

                'Supabase imerudisha error: ' +

                '<strong>' +

                (
                    url.errorDescription ||
                    url.error ||
                    'Invalid recovery link'
                ) +

                '</strong>' +

                '<br><br>' +

                'Tafadhali omba link mpya ya kurejesha nenosiri.'
            );

            return;

        }


        /* ========================================================
           LISTEN FOR PASSWORD_RECOVERY
           IMPORTANT: listener is registered BEFORE getSession()
           ======================================================== */

        recoveryListener =
            supabaseClient.auth.onAuthStateChange(
                async (event, session) => {

                    console.log(
                        'DCF Supabase Auth Event:',
                        event
                    );


                    if (event === 'PASSWORD_RECOVERY') {

                        if (session) {

                            console.log(
                                'Password recovery session confirmed.'
                            );

                            showResetForm();

                        }

                        else {

                            console.error(
                                'PASSWORD_RECOVERY received without session.'
                            );

                            showExpiredLink();

                        }

                    }

                }
            );


        /* ========================================================
           GIVE SUPABASE TIME TO PROCESS URL
           ======================================================== */

        await new Promise(
            resolve => setTimeout(resolve, 700)
        );


        /* ========================================================
           GET CURRENT SESSION
           ======================================================== */

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            throw error;

        }


        console.log(
            'DCF Current Supabase Session:',
            !!data?.session
        );


        /* ========================================================
           SESSION EXISTS
           ======================================================== */

        if (data?.session) {

            showResetForm();

            return;

        }


        /* ========================================================
           WAIT A LITTLE LONGER FOR AUTH EVENT
           ======================================================== */

        await new Promise(
            resolve => setTimeout(resolve, 1500)
        );


        if (recoveryReady) {

            return;

        }


        /* ========================================================
           NO SESSION
           ======================================================== */

        showExpiredLink();


    }

    catch (error) {

        console.error(
            'DCF Password Recovery Initialization Error:',
            error
        );


        hideLoading();

        resetForm.classList.add('hidden');


        showError(

            '<strong>Imeshindikana kuthibitisha link.</strong>' +

            '<br><br>' +

            (
                error?.message ||
                'Tafadhali omba link mpya ya kurejesha nenosiri.'
            )

        );

    }

}


/* ================================================================
   SUBMIT NEW PASSWORD
   ================================================================ */

resetForm.addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();


        errorBox.classList.add('hidden');

        successBox.classList.add('hidden');


        const password =
            newPassword.value.trim();

        const confirm =
            confirmPassword.value.trim();


        /* ========================================================
           VALIDATE PASSWORD
           ======================================================== */

        if (password.length < 6) {

            showError(
                'Nenosiri lazima liwe na angalau herufi 6.'
            );

            return;

        }


        if (password !== confirm) {

            showError(
                'Nenosiri mbili hazifanani.'
            );

            return;

        }


        /* ========================================================
           DISABLE BUTTON
           ======================================================== */

        resetBtn.disabled = true;

        resetBtn.innerHTML =
            '<span class="spinner"></span>' +
            '<span>Inahifadhi...</span>';


        try {


            /* ====================================================
               GET CURRENT SESSION
               ==================================================== */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabaseClient.auth.getSession();


            if (sessionError) {

                throw sessionError;

            }


            if (
                !sessionData ||
                !sessionData.session
            ) {

                throw new Error(
                    'Link ya kurejesha nenosiri imekwisha muda wake. Omba link mpya.'
                );

            }


            console.log(
                'Updating Supabase user password...'
            );


            /* ====================================================
               UPDATE PASSWORD
               ==================================================== */

            const {
                data,
                error
            } =
                await supabaseClient.auth.updateUser({

                    password: password

                });


            if (error) {

                throw error;

            }


            console.log(
                'Password updated successfully.',
                data?.user?.id
            );


            /* ====================================================
               SUCCESS
               ==================================================== */

            showSuccess(

                '<strong>✓ Nenosiri limebadilishwa kikamilifu!</strong>' +

                '<br><br>' +

                'Nenosiri lako jipya limehifadhiwa.' +

                '<br>' +

                'Utapelekwa kwenye Login...'

            );


            resetForm.reset();

            passwordMatch.classList.add('hidden');


            /* ====================================================
               SIGN OUT RECOVERY SESSION
               ==================================================== */

            try {

                await supabaseClient.auth.signOut();

            }

            catch (signOutError) {

                console.warn(
                    'Recovery sign-out warning:',
                    signOutError
                );

            }


            /* ====================================================
               REDIRECT LOGIN
               ==================================================== */

            setTimeout(
                function() {

                    window.location.replace(
                        'index.html'
                    );

                },
                2200
            );


        }

        catch (error) {

            console.error(
                'DCF Password Update Error:',
                error
            );


            let message =
                error?.message ||
                'Tafadhali omba link mpya ya kurejesha nenosiri.';


            /* ====================================================
               FRIENDLY SUPABASE ERRORS
               ==================================================== */

            if (
                message.toLowerCase().includes(
                    'same password'
                )
            ) {

                message =
                    'Nenosiri jipya haliwezi kuwa sawa na nenosiri la zamani.';

            }


            else if (
                message.toLowerCase().includes(
                    'password should be at least'
                )
            ) {

                message =
                    'Nenosiri lazima liwe na angalau herufi 6.';

            }


            else if (
                message.toLowerCase().includes(
                    'jwt'
                ) ||
                message.toLowerCase().includes(
                    'session'
                )
            ) {

                message =
                    'Session ya kurejesha nenosiri imekwisha muda wake. Omba link mpya.';

            }


            showError(

                '<strong>Imeshindikana kubadilisha nenosiri.</strong>' +

                '<br><br>' +

                message

            );

        }

        finally {

            resetBtn.disabled = false;

            resetBtn.innerHTML =

                '<span>Weka Nenosiri Jipya</span>' +

                '<i class="fas fa-check"></i>';

        }

    }
);


/* ================================================================
   START
   ================================================================ */

if (
    document.readyState === 'loading'
) {

    document.addEventListener(
        'DOMContentLoaded',
        initializeRecovery
    );

}

else {

    initializeRecovery();

}

</script>


</body>

</html>
